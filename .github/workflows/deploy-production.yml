name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]

# Source integration must never activate AWS. Production activation is a separate
# inventory review plus exact approved digest, not an unchecked main push.
permissions:
  contents: read

concurrency:
  group: zoolandingpage-aws-infra-production-promotion
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      promotion_mode: ${{ steps.promotion.outputs.mode }}
    env:
      FRONTEND_PRODUCTION_CUSTOM_DOMAIN_NAMES_ENABLED: ${{ vars.FRONTEND_PRODUCTION_CUSTOM_DOMAIN_NAMES_ENABLED || 'false' }}
      FRONTEND_PRODUCTION_THN_PUBLIC_ORIGIN_ENABLED: ${{ vars.FRONTEND_PRODUCTION_THN_PUBLIC_ORIGIN_ENABLED || 'false' }}
      FRONTEND_PRODUCTION_THN_PUBLIC_CERTIFICATE_ARN: ${{ vars.FRONTEND_PRODUCTION_THN_PUBLIC_CERTIFICATE_ARN }}
      FRONTEND_PRODUCTION_THN_PUBLIC_ROUTE53_RECORDS_ENABLED: ${{ vars.FRONTEND_PRODUCTION_THN_PUBLIC_ROUTE53_RECORDS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact reviewed test merge
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_FORCED: ${{ github.event.forced || false }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push" || {
            echo "::error::production_activation_requires_reviewed_workflow"
            exit 1
          }
          test "$PUSH_FORCED" != "true"
          git fetch --no-tags origin refs/heads/test:refs/remotes/origin/test
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test -n "$first_parent" && test -n "$second_parent" && test -z "${extra:-}"
          test "$first_parent" = "$BEFORE_SHA"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/test)"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.2
          cache: npm
      - name: Classify exact source-only production promotion
        id: promotion
        shell: bash
        env:
          INFRA_PRODUCTION_PROMOTION_SELECTION_JSON: ${{ vars.INFRA_PRODUCTION_PROMOTION_SELECTION_JSON }}
        run: |
          set -euo pipefail
          PROMOTED_SOURCE_SHA="$(git rev-parse refs/remotes/origin/test)"
          PROMOTED_SOURCE_TREE="$(git rev-parse 'refs/remotes/origin/test^{tree}')"
          PROMOTED_TARGET_BASE_SHA="$(git rev-parse HEAD^1)"
          PROMOTED_MERGE_TREE="$(git merge-tree --write-tree "$PROMOTED_TARGET_BASE_SHA" "$PROMOTED_SOURCE_SHA")"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PROMOTED_MERGE_TREE"
          export PROMOTED_SOURCE_SHA PROMOTED_SOURCE_TREE PROMOTED_TARGET_BASE_SHA PROMOTED_MERGE_TREE
          mode="$(node tools/classify-production-promotion.js)"
          test "$mode" = "thn-source-only"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run validate
