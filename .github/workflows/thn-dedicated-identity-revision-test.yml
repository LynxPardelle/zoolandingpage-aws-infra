name: THN TEST dedicated runtime identity revision

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only verification or exact one-policy IAM revision
        type: choice
        options: [verify, apply]
        default: verify
        required: true
      reviewed_source_sha:
        description: Full SHA of the reviewed TEST promotion commit
        type: string
        required: true
      reviewed_additions_sha256:
        description: SHA-256 of the three reviewed CDK identity definitions
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: zoolandingpage-aws-infra-test-frontend
  cancel-in-progress: false

jobs:
  dedicated-identity-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_MAX_ATTEMPTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
      REVIEWED_ADDITIONS_SHA256: ${{ inputs.reviewed_additions_sha256 }}
      THN_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate source and candidate without AWS
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/test
          test "$GITHUB_SHA" = "$REVIEWED_SOURCE_SHA"
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_ADDITIONS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$commit" = "$GITHUB_SHA"
          test -n "$first_parent"
          test -n "$second_parent"
          test -z "${extra:-}"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/dev^{tree}')"
          test -z "$(git status --porcelain)"
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/thn-dedicated-runtime-identity.test.js test/thn-dedicated-identity-workflow.test.js
          python -m unittest discover -s test -p test_thn_dedicated_identity_revision.py
          node tools/thn-dedicated-identity-candidate.js > "$RUNNER_TEMP/thn-dedicated-identity-candidate.json"
          python -c 'import json,os,sys;sys.path.insert(0,"tools");from thn_dedicated_identity_release import validate_candidate;validate_candidate(json.load(open(sys.argv[1],encoding="utf-8")),os.environ["REVIEWED_ADDITIONS_SHA256"])' "$RUNNER_TEMP/thn-dedicated-identity-candidate.json"
      - name: Install pinned AWS SDK before credentials
        run: python -m pip install --disable-pip-version-check boto3==1.43.84
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify or apply only the reviewed TEST execution policy revision
        shell: bash
        run: python tools/thn_dedicated_identity_revision.py --operation "$THN_OPERATION" --candidate "$RUNNER_TEMP/thn-dedicated-identity-candidate.json"
