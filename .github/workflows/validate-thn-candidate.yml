# QA evidence only. This workflow never promotes or deploys a release.
name: Validate THN candidate (no deploy)

on:
  push:
    branches: ['codex/thn-task029-infra']

permissions:
  contents: read

concurrency:
  group: thn-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      SAM_CLI_TELEMETRY: '0'
      LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history with the pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history" --redact=100 --no-banner --ignore-gitleaks-allow .
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Test and synthesize only the TEST candidate
        env:
          FRONTEND_TEST_RELEASE_ID: 01b6e9f8dbdbb52532502b78d89b170a96e6000c
        run: |
          npm ci
          npm test
          npx cdk synth 'ZoolandingTest/*' --no-lookups --output cdk.out-thn-validation
          mkdir -p logs/thn-ci
          tar -cf logs/thn-ci/candidate.tar -C cdk.out-thn-validation .
      - name: Record exact source, run and candidate digest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive = Path('logs/thn-ci/candidate.tar')
          record = {
              'schemaVersion': 1, 'purpose': 'validation-only', 'deployable': False,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceRef': os.environ['GITHUB_REF'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'packageFile': archive.name,
              'packageSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'packageBytes': archive.stat().st_size,
          }
          Path('logs/thn-ci/source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thn-candidate-infra-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/thn-ci/candidate.tar
            logs/thn-ci/source.json
          retention-days: 30
          if-no-files-found: error
