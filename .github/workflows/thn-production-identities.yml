name: THN Production Deployment Identities Native Review

on:
  workflow_dispatch:
    inputs:
      identity_scope:
        required: true
        type: choice
        options: [bootstrap, trust-patch, hub-rule-policy-patch, hub-import-read-patch]
        default: bootstrap
      execution:
        required: true
        type: choice
        options: [review, execute, cleanup]
        default: review
      expected_source_sha:
        required: true
        type: string
      reviewed_run_id:
        required: false
        type: string
      expected_review_digest:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zoolandingpage-production-frontend-reviewed-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_package_sha256: ${{ steps.source.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Validate exact current MAIN and manual authority without AWS
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXECUTION: ${{ inputs.execution }}
          IDENTITY_SCOPE: ${{ inputs.identity_scope }}
          REVIEWED_RUN_ID: ${{ inputs.reviewed_run_id }}
          EXPECTED_REVIEW_DIGEST: ${{ inputs.expected_review_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = LynxPardelle/zoolandingpage-aws-infra
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          case "$IDENTITY_SCOPE" in bootstrap|trust-patch|hub-rule-policy-patch|hub-import-read-patch) ;; *) exit 1 ;; esac
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SOURCE_SHA"
          case "$EXECUTION" in
            review) test -z "$REVIEWED_RUN_ID"; test -z "$EXPECTED_REVIEW_DIGEST" ;;
            execute|cleanup)
              [[ "$REVIEWED_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
              [[ "$EXPECTED_REVIEW_DIGEST" =~ ^[a-f0-9]{64}$ ]]
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_RUN_ID" > run.json
              node -e 'const r=require("./run.json");if(r.head_branch!=="main"||r.head_sha!==process.env.EXPECTED_SOURCE_SHA||r.event!=="workflow_dispatch"||r.status!=="completed"||r.conclusion!=="success"||r.path!==".github/workflows/thn-production-identities.yml")throw Error("review_run_authority_invalid")'
              ;;
            *) exit 1 ;;
          esac
          npm ci
          node --test test/thn-production-identities.test.js test/thn-production-identities-trust.test.js test/thn-production-identities-hub-rule-patch.test.js test/thn-production-retained-review.test.js
          node -e 'process.stdout.write("fingerprint="+require("./tools/thn-production-identities").sourcePackageHash()+"\n")' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.execution != 'review'
        with:
          name: thn-production-identities-review-${{ inputs.expected_source_sha }}
          path: retained-review
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reviewed_run_id }}
      - name: Validate reviewed record before credentials
        if: inputs.execution != 'review'
        env:
          EXPECTED_REVIEW_DIGEST: ${{ inputs.expected_review_digest }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_PACKAGE_SHA256: ${{ steps.source.outputs.fingerprint }}
          IDENTITY_SCOPE: ${{ inputs.identity_scope }}
        run: |
          node -e 'const r=require("./retained-review/identities-review.json"),scope=process.env.IDENTITY_SCOPE,purpose=scope==="hub-import-read-patch"?"deployment-identities-hub-import-read-patch":scope==="hub-rule-policy-patch"?"deployment-identities-hub-rule-policy-patch":scope==="trust-patch"?"deployment-identities-trust-patch":"deployment-identities";require("./tools/thn-production-retained-review").validateReview(r);if(r.digest!==process.env.EXPECTED_REVIEW_DIGEST||r.sourceSha!==process.env.EXPECTED_SOURCE_SHA||r.sourcePackageSha256!==process.env.EXPECTED_SOURCE_PACKAGE_SHA256||r.purpose!==purpose)throw Error("retained_review_invalid")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.execution != 'review'
        with:
          name: thn-production-identities-execute-input-${{ github.run_id }}
          path: retained-review/identities-review.json
          if-no-files-found: error
          retention-days: 2
  operation:
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION: ${{ inputs.execution }}
      IDENTITY_SCOPE: ${{ inputs.identity_scope }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_SOURCE_PACKAGE_SHA256: ${{ needs.validate.outputs.source_package_sha256 }}
      EXPECTED_REVIEW_DIGEST: ${{ inputs.expected_review_digest }}
      REVIEW_FILE: retained-review/identities-review.json
      REVIEW_OUTPUT_FILE: identities-review.json
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Repeat sealed source before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SOURCE_SHA"
          node -e 'if(require("./tools/thn-production-identities").sourcePackageHash()!==process.env.EXPECTED_SOURCE_PACKAGE_SHA256)throw Error("source_package_changed")'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.execution != 'review'
        with:
          name: thn-production-identities-execute-input-${{ github.run_id }}
          path: retained-review
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::765932874577:role/zoolandingpage-infra-production-github-oidc-deploy
          aws-region: us-east-1
          allowed-account-ids: "765932874577"
          role-session-name: thn-production-identities-${{ github.run_id }}
      - name: Run exact retained native operation
        run: node tools/thn-production-identities.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.execution == 'review'
        with:
          name: thn-production-identities-review-${{ inputs.expected_source_sha }}
          path: identities-review.json
          if-no-files-found: error
          retention-days: 2
