name: THN TEST prerequisites

on:
  workflow_dispatch:
    inputs:
      operation:
        description: One exact retained prerequisite Add in its existing TEST stack
        type: choice
        options: [certificate, operator-role]
        required: true
      reviewed_ledger_base64:
        description: Canonical public-safe reviewed ledger; hashes only, no identifiers or secret values
        type: string
        required: true
      reviewed_ledger_sha256:
        description: Independently approved SHA-256 of the exact ledger bytes
        type: string
        required: true
      approve_exact_prerequisite:
        description: Approve only this ledger, enable-only protection and its single retained Add
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: zoolandingpage-aws-infra-test-frontend
  cancel-in-progress: false

env:
  PREREQUISITE_OPERATION: ${{ inputs.operation }}
  APPROVE_EXACT_PREREQUISITE: ${{ inputs.approve_exact_prerequisite && 'true' || 'false' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.artifact.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Verify exact TEST promotion source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/test
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$APPROVE_EXACT_PREREQUISITE" = true
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$commit" = "$GITHUB_SHA"
          test -n "$first_parent"
          test -n "$second_parent"
          test -z "${extra:-}"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/dev^{tree}')"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Validate source without cloud credentials or private inputs
        run: npm ci && npm test
      - name: Seal hashes and existing public CDK coordinates, excluding private inputs
        id: artifact
        shell: bash
        env:
          REVIEWED_LEDGER_BASE64: ${{ inputs.reviewed_ledger_base64 }}
          REVIEWED_LEDGER_SHA256: ${{ inputs.reviewed_ledger_sha256 }}
          THN_TEST_OPERATOR_PRINCIPAL_ARN: ${{ secrets.THN_TEST_OPERATOR_PRINCIPAL_ARN }}
          FRONTEND_TEST_THN_ADMIN_HOSTED_ZONE_ID: ${{ vars.FRONTEND_TEST_THN_ADMIN_HOSTED_ZONE_ID }}
        run: |
          set -euo pipefail
          result="$(node tools/thn-test-prerequisites.js prepare .prerequisite)"
          digest="$(RESULT="$result" node -e 'process.stdout.write(JSON.parse(process.env.RESULT).manifestSha256)')"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          printf 'manifest_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: thn-prerequisite-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .prerequisite/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_PREREQUISITE_MANIFEST_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: .transport
          merge-multiple: true
      - name: Verify immutable prerequisite before credentials
        shell: bash
        env:
          THN_TEST_OPERATOR_PRINCIPAL_ARN: ${{ secrets.THN_TEST_OPERATOR_PRINCIPAL_ARN }}
          FRONTEND_TEST_THN_ADMIN_HOSTED_ZONE_ID: ${{ vars.FRONTEND_TEST_THN_ADMIN_HOSTED_ZONE_ID }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PREREQUISITE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(sha256sum .transport/manifest.sha256 | cut -d' ' -f1)" = "$EXPECTED_PREREQUISITE_MANIFEST_SHA256"
          (cd .transport && sha256sum --check --strict manifest.sha256)
          node .transport/thn-test-prerequisites.js verify .transport
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Protect, prepare, review, execute and verify only the sealed prerequisite
        env:
          THN_TEST_OPERATOR_PRINCIPAL_ARN: ${{ secrets.THN_TEST_OPERATOR_PRINCIPAL_ARN }}
          FRONTEND_TEST_THN_ADMIN_HOSTED_ZONE_ID: ${{ vars.FRONTEND_TEST_THN_ADMIN_HOSTED_ZONE_ID }}
        run: node .transport/thn-test-prerequisites.js run .transport
