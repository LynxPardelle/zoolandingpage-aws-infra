name: TEST deployment identity tests (no AWS)
on:
  push:
    branches: ['codex/thn-test-deploy-identities']
  pull_request:
    paths:
      - 'lib/stacks/service-repository-bootstrap-stack.js'
      - 'lib/stacks/thn-test-deploy-identities.js'
      - 'test/**'
      - '.github/workflows/thn-identity-tests.yml'
permissions:
  contents: read
concurrency:
  group: thn-identities-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Test infrastructure without network access or AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-home"
          sudo -- unshare --net -- env -i PATH="$PATH" HOME="$RUNNER_TEMP/offline-home" node --test

